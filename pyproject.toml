[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[project]
name = "seeg-utilities"
version = "0.1.0"
description = "Miscellaneous utilities to work with sEEG data"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Raj Magesh Gauthaman", email = "seeg-utilities@raj-magesh.org" },
]
keywords = [
    "sEEG",
    "contact locator",
    "CT to MRI (T1w) alignment",
    "DICOM to NIfTI conversion",
    "electrode metadata",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
urls = { source = "https://codeberg.org/raj-magesh/seeg-utilities" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "nibabel",
    "nilearn",
    "mne",
    "seaborn",
    "ipywidgets",
    "dipy",
    "k3d",
    "matplotlib",
    "pyvista[jupyter]",
    "hough-3d-line-detector",
    # "trame-pyvista[jupyter]",
]
import-names = ["seeg_utilities"]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "deptry",
    "pytest",
    "sphinx",
    "pandas-stubs",
    "scipy-stubs",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
hough-3d-line-detector = { path = "../hough-3d-line-detector", editable = true }

[tool.deptry.per_rule_ignores]
DEP002 = ["pyvista"]
