[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[project]
name = "seeg-utilities"
description = "Miscellaneous utilities to work with sEEG data"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Raj Magesh Gauthaman", email = "seeg-utilities@raj-magesh.org" },
]
keywords = [
    "sEEG",
    "contact locator",
    "RippleNeuroMed control",
    "CT to MRI (T1w) alignment",
    "DICOM to NIfTI conversion",
    "electrode metadata",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
urls = { repository = "https://codeberg.org/raj-magesh/seeg-utilities" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "nibabel",
    "nilearn",
    "seaborn",
    "dipy",
    "k3d",
    "matplotlib",
    "hough-3d-line-detector",
]
import-names = ["seeg_utilities"]
version = "0.1.0"

[dependency-groups]
dev = ["ruff", "ty", "pytest", "sphinx", "pandas-stubs", "scipy-stubs"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
